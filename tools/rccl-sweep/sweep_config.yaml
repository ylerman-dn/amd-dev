# RCCL Test Sweep Configuration
# This file contains default settings for the sweep tool.
# Command-line arguments override these defaults.

# MPI Configuration
mpi:
  mpirun_path: "/opt/ompi-4.1.6/bin/mpirun"
  bind_to: "numa"
  allow_run_as_root: true
  oob_tcp_if: "enp81s0f1np1"
  btl_tcp_if: "enp81s0f1np1"

# Test Defaults (rccl-tests parameters)
test_defaults:
  min_bytes: "4K"           # -b parameter
  max_bytes: "16G"          # -e parameter
  step_factor: 2            # -f parameter
  gpus_per_rank: 1          # -g parameter
  # GPU-107: -n 20 -w 5 matches every trusted measurement in results-tuning/.
  # Measured on busbw_ip across 540 (size, algo, proto, channels) points, 3 repeats
  # each, 1 node -- comparing the -n 5 sweep against the -n 20 sweep:
  #            median spread   p90     points over 5%
  #   -n 5       0.95%        6.06%    65 of 540 (12%)
  #   -n 20      0.64%        2.59%    18 of 540 ( 3%)
  # The median is already fine at -n 5; what -n 20 buys is the TAIL. Points whose
  # own spread exceeds optimize_metrics.py's 5% tolerance can win that comparison
  # by luck, and -n 20 cuts them from 12% to 3%.
  # Cost is ~25% wall time, not 4x: per-run fixed cost (process start, RCCL init,
  # 18 size setups) dominates the iteration loop. See results-tuning/TIMINGS.md.
  # Evidence: results-tuning/2026-08-04-1-sweep1node/{merged.csv,superseded-n5/merged.csv}
  iterations: 20            # -n parameter
  warmup_iters: 5           # -w parameter
  check_iters: 1            # -c parameter
  # GPU-107: MUST stay 0. -C/--report_cputime replaces the time column with CPU
  # launch time (~constant regardless of collective duration), which makes
  # time-based ranking meaningless. busbw is unaffected, but leave this off so the
  # time column stays wall-clock and usable.
  report_cputime: 0         # -C parameter (report CPU time) - keep 0
  # GPU-107: emitted as -A (--output_algo_proto_channels) on this build, NOT -M.
  # Here -M is --memory_report. Upstream rccl-tests uses -M; ours moved it.
  show_algo_proto_channels: 1 # -A parameter (show algorithm, protocol, and channels)
  timeout: 600              # seconds per test

# GPU-107: keep every run's NCCL_DEBUG=INFO log next to its results, as dbg_%p.log in the run folder.
# Without it no sweep row meets this project's verification bar -- "a run only counts if the log
# confirms which algo/proto/nchannels were actually SELECTED" -- because -A 1 alone is untrustworthy
# for channels (it reports a planned ceiling, not what ran).
# Free within measurement resolution: mean -0.06% across 18 sizes, 5-repeat ranges overlapping 18/18
# (results-tuning/2026-08-03-5-lognoise/). Costs disk: roughly 1 MB per rank per run.
keep_info_logs: true

# Node Configuration
nodes:
  gpus_per_node: 8

# Collectives to test (when --collective all is used)
collectives:
  - all_reduce_perf
  - reduce_scatter_perf
  - all_gather_perf
  - alltoall_perf
  - broadcast_perf
  - reduce_perf

# Paths Configuration
paths:
  # Single path containing both RCCL library and rccl-tests executables
  # Set MY_PATH environment variable before running, or override here with absolute path
  # Example: export MY_PATH=/home/amir/rccl-bins/develop
  rccl_path: "${MY_PATH}"

# Fixed Environment Variables
# These are set for all test runs
env_vars:
  # Path configuration
  PATH: "/usr/local/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
  
  # Network interface
  NCCL_SOCKET_IFNAME: "enp81s0f1np1"
  
  # InfiniBand HCA configuration
  NCCL_IB_HCA: "ionic_0:1,ionic_1:1,ionic_2:1,ionic_3:1,ionic_4:1,ionic_5:1,ionic_7:1,ionic_8:1"
  NCCL_IB_GID_INDEX: 1
  NCCL_IB_TIMEOUT: 5
  
  # GDR settings
  NCCL_GDR_FLUSH_DISABLE: 1
  RCCL_GDR_FLUSH_GPU_MEM_NO_RELAXED_ORDERING: 0
  NCCL_GDRCOPY_ENABLE: 0
  
  # InfiniBand settings
  NCCL_IB_QPS_PER_CONNECTION: 2
  NCCL_IB_TC: 104
  NCCL_IB_FIFO_TC: 192
  NCCL_IB_USE_INLINE: 1
  
  # IONIC settings
  IONIC_RCQ_NUM_PATHS: 255
  IONIC_PRIVATE_SERVICE_FORCE: 1
  IONIC_RCQ_SIGN_BIT: 15
  IONIC_LOCKFREE: "all"
  
  # Other NCCL settings
  HSA_NO_SCRATCH_RECLAIM: 1
  NCCL_IGNORE_CPU_AFFINITY: 1
  NET_OPTIONAL_RECV_COMPLETION: 1
  NCCL_PXN_DISABLE: 0
  
  # Debug/dump settings
  # GPU-107: overridden to INFO per-run by sweep_executor.py, which also sets NCCL_DEBUG_FILE so the
  # log lands in that run's own folder. Kept as VERSION here so any code path that does NOT set a
  # debug file cannot accidentally put INFO on stdout, where it costs up to 4% and interleaves with
  # the data rows. See keep_info_logs below.
  NCCL_DEBUG: "VERSION"
  NCCL_TOPO_DUMP_FILE: "/tmp/system_run2.txt"
  NCCL_GRAPH_DUMP_FILE: "/tmp/dump_graph.txt"

# Channel configuration is passed via CLI (--channels MIN:MAX:STEP)
# These will override NCCL_MIN_NCHANNELS and NCCL_MAX_NCHANNELS

# Output Configuration
output:
  # Base directory for results
  results_dir: "sweep_results"
  
  # Database filename
  database: "sweep_results.db"
  
  # Save detailed logs
  save_logs: true

