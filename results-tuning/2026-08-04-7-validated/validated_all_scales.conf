# GPU-107 validated RCCL tuner config — all_reduce, MI355X (gfx950)
#
# Every rule here beat RCCL's default in an interleaved A/B with 7 repeats per arm,
# at probability-of-superiority 1.00 (the config won every head-to-head pair) and
# median gain > 2%, with no size inside the rule's range regressing.
#
# Generated 2026-08-04. RCCL 2.28.3-develop:2e42aa8, rccl-tests 2.17.9-develop:2e42aa8.
# Deploy via NCCL_TUNER_PLUGIN=librccl-tunerv4-dn.so + NCCL_TUNER_CONFIG_FILE=<this>.
#
# Rules are scoped by nNodes/nRanks, so only those matching the running job apply.
# Measured gains:
#   1 node  (8 rules): +12.5% @4K, +29.1% @8K, +45.3% @16K, +56.1% @32K,
#                      +60.2% @64K, +32.3% @128K, +39.5% @256K, +63.0% @512K-1M
#   2 nodes (1 rule):  +11.1% @32M
#   3 nodes (2 rules): +8.7% @32M, +10.2% @64M-128M
#
# NOT covered, deliberately:
#   - >=2M at 1 node: no rule beat default; >=64M is actively dangerous (see below).
#   - Most multi-node sizes: RCCL's multi-node defaults are already at the 48-channel
#     cap and hard to improve on.
#   - Collectives other than all_reduce: not swept.
#
# WARNING - plugin channel semantics differ from the env var. Where WarpSpeed is active
# (>=64M at 1 node) the plugin's 'channels' field is the POST-multiplier total, while
# NCCL_MIN/MAX_NCHANNELS sets the base. Writing an env-var-swept channel value into a
# plugin rule there under-provisions channels 4x: a 48 request became 12 base / 48 actual
# against the default's 56 base / 224 actual, costing -65.7%. That is why no 1-node rule
# above 1M appears here.
#
# Validated by validate_tuner_config.py: only rules that beat RCCL default
# FORMAT NOTE - the two tools disagree about the header line:
#   dn/dn-tuner/plugin.c:199 skips only '#' and blank lines, so it parses the header
#   below as one extra (harmless, non-matching) rule -- this is why the plugin logs one
#   more 'configuration' than there are real rules.
#   validate_tuner_config.py's parse_rules() DOES treat the first non-comment line as a
#   header, so removing it would make the validator swallow the first real rule.
#   Keeping it: harmless to the plugin, required by the validator.
#
