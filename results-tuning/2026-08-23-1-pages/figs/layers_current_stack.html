<!doctype html><meta charset=utf-8><style>body{margin:0;background:#12161d;font-family:system-ui,sans-serif}svg text{fill:#e6e9ef}</style>
<svg id=f viewBox="0 0 1000 420" width="1000" height="420" xmlns="http://www.w3.org/2000/svg" font-size="14">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa4b2"/></marker></defs>
<text x="16" y="26" font-size="15" fill="#9aa4b2">One all_reduce call from SGLang, tensor-parallel 8 GPUs, one MI355X node. Who executes it, top to bottom:</text>
<text x="560" y="26" font-size="13" fill="#9aa4b2"></text>
<!-- layer 1 -->
<rect x="16" y="44" width="430" height="74" rx="8" fill="#5a3a1a" stroke="#f0a94a"/>
<text x="30" y="70" font-weight="700" font-size="16">1. SGLang custom all-reduce (AITER)</text>
<text x="30" y="92" font-size="12.5" fill="#d9dee6">on by default · one node · every call up to 64 MiB</text>
<text x="30" y="109" font-size="12.5" fill="#d9dee6">RCCL never sees these calls</text>
<line x1="60" y1="118" x2="60" y2="146" stroke="#9aa4b2" marker-end="url(#a)"/><text x="72" y="138" font-size="12" fill="#9aa4b2">only if disabled by flag</text>
<!-- layer 2 -->
<rect x="16" y="150" width="430" height="74" rx="8" fill="#15301a" stroke="#6fcf7a"/>
<text x="30" y="176" font-weight="700" font-size="16">2. RCCL direct all-reduce (DDA)</text>
<text x="30" y="198" font-size="12.5" fill="#d9dee6">new in RCCL 2.30 · one node, 8 ranks · every call up to 64 MiB</text>
<text x="30" y="215" font-size="12.5" fill="#d9dee6">decided before any tuner is consulted</text>
<line x1="60" y1="224" x2="60" y2="252" stroke="#9aa4b2" marker-end="url(#a)"/><text x="72" y="244" font-size="12" fill="#9aa4b2">only if disabled by env, or above 64 MiB</text>
<!-- layer 3 -->
<rect x="16" y="256" width="430" height="74" rx="8" fill="#3a2a14" stroke="#f0a94a"/>
<text x="30" y="282" font-weight="700" font-size="16">3. RCCL classic path + tuner rules</text>
<text x="30" y="304" font-size="12.5" fill="#d9dee6">ring / tree · LL / Simple · channel count per message size</text>
<text x="30" y="321" font-size="12.5" fill="#d9dee6">the only layer a tuner configuration can change</text>
<line x1="60" y1="330" x2="60" y2="358" stroke="#9aa4b2" marker-end="url(#a)"/><text x="72" y="350" font-size="12" fill="#9aa4b2">no rule for this size</text>
<!-- layer 4 -->
<rect x="16" y="362" width="430" height="46" rx="8" fill="#1e2a40" stroke="#5aa2f0"/>
<text x="30" y="391" font-weight="700" font-size="16">4. RCCL classic path, built-in defaults</text>
<!-- bars: gpt-oss d32 numbers? use qwen d32: stock 5124, none 4978, sc2 4236, nodda 4004 -->
<text x="480" y="60" font-size="13" fill="#9aa4b2">Measured: median tokens/s, Qwen3-30B decode, concurrency 32, same node and hour</text>
<g font-family="ui-monospace,monospace" font-size="13">
<rect x="480" y="72" width="500" height="26" fill="#f0a94a" opacity=".85"/><text x="492" y="90" fill="#12161d" font-weight="700">layer 1 as shipped: 5124</text>
<rect x="480" y="160" width="486" height="26" fill="#6fcf7a" opacity=".85"/><text x="492" y="178" fill="#12161d" font-weight="700">layer 2 (custom AR off): 4978   −3%</text>
<rect x="480" y="266" width="413" height="26" fill="#f0a94a" opacity=".65"/><text x="492" y="284" fill="#12161d" font-weight="700">layer 3, our best conf: 4236   −17%</text>
<rect x="480" y="372" width="391" height="26" fill="#5aa2f0" opacity=".85"/><text x="492" y="390" fill="#12161d" font-weight="700">layer 4 (no tuner): 4004   −22%</text>
</g>
<text x="480" y="130" font-size="12.5" fill="#9aa4b2">The tuner's +6% (layer 3 over layer 4) is real, but the stack never reaches</text>
<text x="480" y="147" font-size="12.5" fill="#9aa4b2">layer 3: layers 1 and 2 take every call first and are faster.</text>
<text x="480" y="236" font-size="12.5" fill="#9aa4b2">Same ordering in all 15 model × traffic tables measured (3 models).</text>
</svg>
